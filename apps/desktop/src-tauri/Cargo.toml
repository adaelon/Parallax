[package]
name = "desktop-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "eam_desktop_app"

[[bin]]
name = "evrything-about-me"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
eam_capture_browser = { package = "capture-browser", path = "../../../crates/capture-browser" }
eam_capture_windows = { package = "capture-windows", path = "../../../crates/capture-windows" }
eam_core = { package = "core", path = "../../../crates/core" }
eam_desktop_host = { package = "desktop-host", path = "../../../crates/desktop-host" }
eam_ingestion = { package = "ingestion", path = "../../../crates/ingestion" }
eam_retrieval = { package = "retrieval", path = "../../../crates/retrieval" }
eam_runtime_gateway = { package = "runtime-gateway", path = "../../../crates/runtime-gateway" }
eam_vault = { package = "vault", path = "../../../crates/vault" }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"
url = "=2.5.7"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
