[package]
name = "capture-browser"
version = "0.1.0"
edition = "2024"

[lib]
name = "eam_capture_browser"

[dependencies]
eam_core = { package = "core", path = "../core" }
eam_desktop_host = { package = "desktop-host", path = "../desktop-host" }
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = "=2.6.1"
url = "=2.5.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
