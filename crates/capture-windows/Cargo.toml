[package]
name = "capture-windows"
version = "0.1.0"
edition = "2024"

[lib]
name = "eam_capture_windows"

[dependencies]
eam_core = { package = "core", path = "../core" }
eam_desktop_host = { package = "desktop-host", path = "../desktop-host" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
